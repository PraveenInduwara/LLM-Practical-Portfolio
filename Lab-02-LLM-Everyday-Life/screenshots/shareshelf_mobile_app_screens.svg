<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="960" viewBox="0 0 1320 960" role="img" aria-labelledby="title desc">
  <title id="title">ShareShelf mobile app preview</title>
  <desc id="desc">Three sample ShareShelf mobile screens showing Home, a categorized pantry, and a kitchen chat with friends.</desc>
